<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N00 — My card</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f1f0ee;color:#141414;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 32px}
#card{display:block;width:100%;max-width:460px;height:auto;background:#fff}
#save{width:100%;max-width:460px;min-height:60px;border:0;background:#C21F1A;color:#fff;font:inherit;font-size:18px;cursor:pointer}
#save[hidden],#card[hidden]{display:none}
p{margin:0;font-size:14px;line-height:1.6;color:#777;text-align:center}
</style>
<img id="card" alt="내 N00 카드" hidden><button id="save" type="button" hidden>이미지 저장</button><p id="hint">카드를 만들고 있어요.</p>
<script>
(async()=>{
const W=1080,H=1620,PAD=90,RED='#C21F1A',FONT="'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
const hint=document.querySelector('#hint'),card=document.querySelector('#card'),save=document.querySelector('#save');
function read(){const raw=new URLSearchParams(location.search).get('c').replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0)),value=JSON.parse(new TextDecoder().decode(bytes));if(typeof value.t!=='string')throw Error('Invalid card');return value}
const load=src=>new Promise(resolve=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=src});
function wrap(g,value,x,y,width,line,max){let row='',rows=[];for(const c of String(value||'')){if(g.measureText(row+c).width>width){rows.push(row);row=c}else row+=c}if(row)rows.push(row);rows=rows.slice(0,max);rows.forEach((r,i)=>g.fillText(r,x,y+i*line));return y+rows.length*line}
function label(g,value,x,y){g.font=`30px ${FONT}`;g.fillStyle='#999';g.fillText(value,x,y)}
try{
 const c=read(),canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const g=canvas.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.textBaseline='top';
 // Only this site's own images may appear on the card.
 const product=/^assets\/[\w./-]+$/.test(c.i||'')?await load(c.i):null;
 if(product){const boxW=W-120,boxH=620,w=c.r?product.naturalHeight:product.naturalWidth,h=c.r?product.naturalWidth:product.naturalHeight,scale=Math.min(boxW/w,boxH/h);g.save();g.translate(W/2,350);if(c.r)g.rotate(Math.PI/2);g.drawImage(product,-product.naturalWidth*scale/2,-product.naturalHeight*scale/2,product.naturalWidth*scale,product.naturalHeight*scale);g.restore()}
 g.font=`28px ${FONT}`;g.fillStyle='#999';g.fillText('N[00] / PERSONAL STUDY',PAD,750);
 g.font=`500 64px ${FONT}`;g.fillStyle='#141414';let y=wrap(g,c.t,PAD,800,W-PAD*2,80,2)+40;
 label(g,'내가 지지한 기획',PAD,y);g.font=`38px ${FONT}`;g.fillStyle='#333';y=wrap(g,c.d,PAD,y+46,W-PAD*2,54,2)+36;
 label(g,'내가 보탠 취향',PAD,y);g.font=`38px ${FONT}`;g.fillStyle='#333';y=wrap(g,c.k,PAD,y+46,W-PAD*2,54,2)+36;
 g.font=`30px ${FONT}`;g.fillStyle='#777';wrap(g,c.o,PAD,y,W-PAD*2,42,1);
 const logo=await load('assets/NOO%20LOGO_FINAL.svg');if(logo)g.drawImage(logo,PAD,H-PAD-175,W-PAD*2,(W-PAD*2)*371.52/1920);
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
 card.src=URL.createObjectURL(blob);card.hidden=false;save.hidden=false;hint.textContent='저장이 안 되면 이미지를 길게 눌러 저장해 주세요.';
 save.onclick=async()=>{const file=new File([blob],'N00-my-card.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]})}catch{}return}const link=document.createElement('a');link.href=card.src;link.download=file.name;link.click()};
}catch{hint.textContent='카드를 불러오지 못했어요. QR을 다시 찍어 주세요.'}
})();
</script></html>
